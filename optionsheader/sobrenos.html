


<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Em Manutenção</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1e1e1e;
      color: #fff;
      text-align: center;
    }

    .maintenance-container {
      max-width: 500px;
      padding: 40px 20px;
      background: #2b2b2b;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .maintenance-container h1 {
      font-size: 3rem;
      color: #05b30e;
      margin-bottom: 20px;
    }

    .maintenance-container p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #ccc;
    }

    .maintenance-container a {
      display: inline-block;
      padding: 12px 25px;
      background-color: #05b30e;
      color: #fff;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }

    .maintenance-container a:hover {
      background-color: #02750d;
      transform: translateY(-2px);
    }

    /* Ícone de manutenção */
    .maintenance-icon {
      font-size: 5rem;
      color: #05b30e;
      margin-bottom: 20px;
    }

    @media (max-width: 480px) {
      .maintenance-container h1 {
        font-size: 2.2rem;
      }

      .maintenance-container p {
        font-size: 1rem;
      }

      .maintenance-icon {
        font-size: 4rem;
      }
    }
  </style>
</head>
<body>
  <div class="maintenance-container">
    <div class="maintenance-icon">🛠️</div>
    <h1>Em Manutenção</h1>
    <p>Desculpe, esta página está em manutenção no momento. Voltaremos em breve!</p>
    <a href="../index.html">Voltar para o início</a>
  </div>
</body>
</html>
